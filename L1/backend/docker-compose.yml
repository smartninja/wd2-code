name: recipe-app                        # project name shown in Docker Desktop

services:
  db:                                   # the PostgreSQL database container
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data # keeps the data when the container stops
    healthcheck:                        # ready once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:                                  # our Flask app container
    build: .
    command: flask run --host 0.0.0.0 --port 8000 --debug
    volumes:
      - .:/app                          # mount our code so edits are seen live
    environment:
      FLASK_APP: main                   # so `flask ...` commands find main.py
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:                         # wait until healthy, not just started
      db:
        condition: service_healthy

volumes:
  dbdata:
